<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b1f2b;--soft:#8a5a6c;--a:#ff4f81;--b:#ff9db8;--card:rgba(255,255,255,.72);--line:rgba(255,255,255,.85);--field:rgba(255,226,236,.6);--bg1:#ffe4ec;--bg2:#ffd3e6;--bg3:#e6dcff;--sh:rgba(255,79,129,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ffe9ef;--soft:#d9a5b8;--card:rgba(52,28,42,.72);--line:rgba(255,255,255,.1);--field:rgba(255,255,255,.07);--bg1:#2a1420;--bg2:#2d1830;--bg3:#1f1a3a;--sh:rgba(255,79,129,.35);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#ffe9ef;--soft:#d9a5b8;--card:rgba(52,28,42,.72);--line:rgba(255,255,255,.1);--field:rgba(255,255,255,.07);--bg1:#2a1420;--bg2:#2d1830;--bg3:#1f1a3a;--sh:rgba(255,79,129,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3)) fixed;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px 16px;overflow-x:hidden;position:relative}
.wrap{width:100%;max-width:420px;position:relative;z-index:1}
.card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:32px;padding:34px 26px 28px;text-align:center;box-shadow:0 24px 60px -20px var(--sh),0 2px 0 rgba(255,255,255,.5) inset;animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}}
.icon{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--b),var(--a));box-shadow:0 14px 30px -8px var(--sh),0 0 0 8px rgba(255,79,129,.12);animation:beat 2.2s ease-in-out infinite}
.icon svg{width:38px;height:38px;fill:#fff}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.09)}24%{transform:scale(1)}36%{transform:scale(1.06)}}
h1{font-size:22px;font-weight:700;margin:0 0 10px;letter-spacing:-.3px;line-height:1.3}
p{line-height:1.65;margin:8px 0;font-size:14.5px}
.soft{color:var(--soft);font-size:13px}
button{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--a),#ff7a9e);box-shadow:0 12px 24px -8px var(--sh);transition:transform .2s,box-shadow .2s}
button:hover{box-shadow:0 16px 28px -8px var(--sh)}
button:active{transform:scale(.96)}
button.ghost{background:var(--field);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
input.f{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:14px;font:inherit;font-size:14px;background:var(--field);color:var(--ink);margin:6px 0;outline:none;transition:.2s}
input.f:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(255,79,129,.15)}
.hide{display:none!important}
.item{background:var(--field);border-radius:18px;padding:14px 16px;margin:10px 0;text-align:left;font-size:13px;line-height:1.6}
.tag{display:inline-block;background:linear-gradient(135deg,var(--a),#ff7a9e);color:#fff;border-radius:99px;padding:2px 12px;font-size:11px;font-weight:600}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lock" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0110 0v3h1a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2v-8a2 2 0 012-2h1zm2 0h6V7a3 3 0 00-6 0v3z"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M4 20V10h4v10H4zm6 0V4h4v16h-4zm6 0v-7h4v7h-4z"/></symbol>
</defs></svg>
<div class="wrap">
<div class="card" id="login">
  <div class="icon"><svg><use href="#lock"/></svg></div>
  <h1>Admin</h1>
  <input class="f" id="email" type="email" placeholder="Email" autocomplete="username">
  <input class="f" id="pass" type="password" placeholder="Password" autocomplete="current-password">
  <p class="soft" id="err"></p>
  <button id="go">Masuk</button>
</div>
<div class="card hide" id="dash">
  <div class="icon"><svg><use href="#chart"/></svg></div>
  <h1>Jawaban Masuk</h1>
  <p class="soft" id="info">Memuat...</p>
  <div id="list"></div>
  <p><button class="ghost" id="refresh">Refresh</button> <button class="ghost" id="out">Keluar</button></p>
</div>
</div>
<script>
// ====== ISI DUA BARIS INI (sama seperti di index.html) ======
const SUPABASE_URL="https://iionmnydqfrfogxteplq.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlpb25tbnlkcWZyZm9neHRlcGxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NDk0NzMsImV4cCI6MjEwODEyNTQ3M30.xeK5J9bOzMgtLHqlAQS3PXRtqx7DoMeZhNC4trUjE-w";

const $=id=>document.getElementById(id);
let token=sessionStorage.getItem("tk")||"";

async function login(){
  $("err").textContent="";
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",
      headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email:$("email").value.trim(),password:$("pass").value})});
    const j=await r.json();
    if(!r.ok||!j.access_token){$("err").textContent=(j.error_description||j.msg||j.message||"Gagal masuk")+" ("+r.status+")";return}
    token=j.access_token;sessionStorage.setItem("tk",token);open_();
  }catch(e){$("err").textContent="Gagal terhubung."}
}
async function load(){
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/answers?select=*&order=created_at.desc",
      {headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+token}});
    if(r.status===401){logout();return}
    const rows=await r.json();
    $("info").textContent=rows.length?rows.length+" jawaban masuk":"Belum ada jawaban. Sabar ya, dia lagi mikir";
    $("list").innerHTML="";
    rows.forEach(d=>{
      const el=document.createElement("div");el.className="item";
      const t=document.createElement("div");
      const tag=document.createElement("span");tag.className="tag";tag.textContent="Dimaafin";
      t.appendChild(tag);t.append("  "+new Date(d.created_at).toLocaleString("id-ID"));
      const a=document.createElement("div");a.textContent="Nolak "+d.nopes+"x \u00b7 Syarat: "+((d.syarat||[]).join(", ")||"-");
      const n=document.createElement("div");n.textContent="Pesan: "+(d.note||"-");
      el.append(t,a,n);$("list").appendChild(el);
    });
  }catch(e){$("info").textContent="Gagal memuat data."}
}
function open_(){$("login").classList.add("hide");$("dash").classList.remove("hide");load()}
function logout(){token="";sessionStorage.removeItem("tk");$("dash").classList.add("hide");$("login").classList.remove("hide")}
$("go").onclick=login;$("pass").onkeydown=e=>{if(e.key==="Enter")login()};
$("refresh").onclick=load;$("out").onclick=logout;
setInterval(()=>{if(token)load()},20000);
if(token)open_();
</script>
</body>
</html>
